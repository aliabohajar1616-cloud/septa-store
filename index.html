<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>متجر سبتة Septa | حزامك.. أناقتك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #FAF7F2;
      --card-bg: #FFFFFF;
      --gold-primary: #B5852A;
      --gold-light: #D6A84F;      
      --gold-dark: #8C6218;
      --text-dark: #3B2818;
      --text-muted: #7A6552;
      --border-soft: #E8DEC8;
      --whatsapp-green: #25D366;
      --whatsapp-dark: #1EBE5D;
      --danger: #C0392B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      line-height: 1.6;
    }

    /* الهيدر */
    header {
      background: linear-gradient(135deg, #FFFDF9 0%, #F4ECE0 100%);
      border-bottom: 2px solid var(--gold-light);
      padding: 24px 16px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(140, 98, 24, 0.08);
    }

    .brand-badge {
      display: inline-block;
      padding: 6px 18px;
      border: 1.5px solid var(--gold-primary);
      border-radius: 50px;
      color: var(--gold-dark);
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 10px;
      background-color: #FFFBF2;
    }

    header h1 {
      font-size: 2.1rem;
      font-weight: 800;
      color: var(--gold-dark);
      letter-spacing: 0.5px;
    }

    header h1 span {
      color: var(--gold-primary);
    }

    header p {
      font-size: 1.15rem;
      color: var(--text-dark);
      font-weight: 600;
      margin-top: 4px;
    }

    /* الحاوية الرئيسية */
    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 26px;
    }

    .section-title h2 {
      font-size: 1.5rem;
      color: var(--text-dark);
      font-weight: 800;
    }

    .section-title .divider {
      width: 70px;
      height: 3px;
      background: linear-gradient(90deg, var(--gold-dark), var(--gold-light));
      margin: 8px auto 0;
      border-radius: 2px;
    }

    /* شبكة المنتجات */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(59, 40, 24, 0.06);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(181, 133, 42, 0.16);
      border-color: var(--gold-light);
    }

    .product-img-wrap {
      width: 100%;
      height: 260px;
      background-color: #F7F2E9;
      position: relative;
      overflow: hidden;
    }

    .product-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .product-code {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(59, 40, 24, 0.85);
      color: #FFF;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .product-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .product-name {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .product-price {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--gold-dark);
      margin-bottom: 12px;
    }

    .product-colors-preview {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .btn-open-order {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
      color: #FFF;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-open-order:hover {
      opacity: 0.92;
    }

    /* نافذة الطلب المنبثقة */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 20, 10, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
      overflow-y: auto;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #FFFDF9;
      border: 2px solid var(--gold-light);
      border-radius: 18px;
      width: 100%;
      max-width: 490px;
      padding: 22px;
      position: relative;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      max-height: 92vh;
      overflow-y: auto;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      left: 14px;
      background: #F3EAD8;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-dark);
      cursor: pointer;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-soft);
      margin-bottom: 16px;
    }

    .modal-header img {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      object-fit: cover;
      border: 1.5px solid var(--gold-primary);
    }

    .modal-header h3 {
      font-size: 1.15rem;
      color: var(--text-dark);
      font-weight: 800;
    }

    .modal-header .modal-price {
      color: var(--gold-dark);
      font-weight: 800;
      font-size: 1.05rem;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.92rem;
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--text-dark);
    }

    .form-group label span.req {
      color: var(--danger);
      margin-right: 3px;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border-soft);
      border-radius: 10px;
      font-size: 0.95rem;
      background: #FFF;
      color: var(--text-dark);
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--gold-primary);
    }

    .form-control.invalid {
      border-color: var(--danger);
      background-color: #FFF8F7;
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: none;
      background: #FDEDEC;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #F5B7B1;
    }

    .btn-whatsapp {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background-color: var(--whatsapp-green);
      color: #FFF;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 14px rgba(37, 211, 102, 0.3);
      transition: background 0.2s;
      margin-top: 6px;
    }

    .btn-whatsapp:hover {
      background-color: var(--whatsapp-dark);
    }

    footer {
      text-align: center;
      padding: 24px 16px;
      margin-top: 40px;
      border-top: 1px solid var(--border-soft);
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>  
  
  <header>
    <div class="brand-badge">تشكيلة الأحزمة الفاخرة</div>
    <h1>متجر سبتة <span>Septa</span></h1>
    <p>حزامك.. أناقتك</p>
        
  </header>        
  
  <main class="container">
    <div class="section-title">
      <h2>اختر الحزام المناسب واطلبه مباشرة</h2>
      <div class="divider"></div>
    </div>

    <div class="products-grid" id="productsGrid"></div>
  </main>
   
  <!-- نافذة الطلب الإجبارية -->
  <div class="modal-overlay" id="orderModal">
    <div class="modal-box">
      <button type="button" class="modal-close" onclick="closeModal()" aria-label="إغلاق">×</button>

      <div class="modal-header">
        <img id="modalImg" src="" alt="صورة المنتج">
        <div>
          <h3 id="modalTitle">اسم المنتج</h3>
          <div class="modal-price" id="modalPriceDisplay"></div>
        </div>
      </div>

      <form id="orderForm" onsubmit="sendWhatsAppOrder(event)" novalidate>
        <input type="hidden" id="productImageFile" />

        <!-- 1. اسم المنتج -->
        <div class="form-group">
          <label for="fieldProductName">اسم المنتج <span class="req">*</span></label>
          <input type="text" id="fieldProductName" class="form-control" readonly  required />
        </div>

        <!-- 2. السعر -->
        <div class="form-group">
          <label for="fieldProductPrice">السعر <span class="req">*</span></label>
          <input type="text" id="fieldProductPrice" class="form-control" readonly required />
        </div>

        <!-- 3. اللون -->
        <div class="form-group">
          <label for="fieldColor">اللون <span class="req">*</span></label>
          <input type="text" id="fieldColor" list="colorsDatalist" class="form-control" readonly  required placeholder="اختر أو اكتب اللون المطلوب" />
          <datalist id="colorsDatalist"></datalist>
        </div>

        <!-- 4. الكمية المطلوبة -->
        <div class="form-group">
          <label for="fieldQuantity">الكمية المطلوبة <span class="req">*</span></label>
          <input type="number" id="fieldQuantity" class="form-control" min="1" value="1" required placeholder="أدخل الكمية" />
        </div>

        <!-- 5. الاسم الثلاثي -->
        <div class="form-group">
          <label for="fieldFullName">الاسم الثلاثي <span class="req">*</span></label>
          <input type="text" id="fieldFullName" class="form-control" required placeholder="مثال: محمد سالم علي" />
        </div>

        <!-- 6. رقم الهاتف -->
        <div class="form-group">
          <label for="fieldPhone">رقم الهاتف <span class="req">*</span></label>
          <input type="tel" id="fieldPhone" class="form-control" required placeholder="مثال: 0915334455" />
        </div>

        <!-- 7. العنوان -->
        <div class="form-group">
          <label for="fieldAddress">العنوان <span class="req">*</span></label>
          <input type="text" id="fieldAddress" class="form-control" required placeholder="المدينة - المنطقة - أقرب نقطة دالة" />
        </div>

        <div class="error-msg" id="errorMsg">جميع الخانات إجبارية! يرجى تعبئة جميع الحقول المطلوبة قبل الطلب عبر الواتساب.</div>

        <button type="submit" class="btn-whatsapp">
          <span>طلب عبر الواتساب</span>
        </button>
      </form>
    </div>
  </div>
     
  <footer>
    جميع الحقوق محفوظة © متجر سبتة Septa
  </footer>

  <script>
    // =========================================================
    // رقم واتساب صاحب المحل
    // =========================================================
    const SHOP_WHATSAPP = "218915334455";

    // =========================================================
    // قائمة المنتجات (septa1.jpg إلى septa21.jpg)
    // عدّل الاسم والسعر والألوان هنا بحرية
    // =========================================================
    const products = [ 
      { id: 1,  img: "septa1.jpg",  name: "حزام بديل السبتة",  price: "35د.ل", colors: ["أسود"] },
      { id: 2,  img: "septa2.jpg",  name: "حزام إخفاء النقود",  price:"95د.ل", colors: [ "أسود رصاصي"] },
      { id: 3,  img: "septa3.jpg",  name:"سبتة أطفال جلد",  price:"105د.ل", colors: ["أسود كحلي"] },     
         { id: 27, img: "septa27.jpg", name: "سبتة  أطفال جلد", price: "105د.ل", colors: ["أبيض"] },
       { id: 28, img: "septa28.jpg", name: "سبتة أطفال جلد", price: "105د.ل", colors: ["بني عسلي"] },
      { id: 7,  img: "septa7.jpg",  name: "حزام مطاطي رقيق",  price: "85د.ل", colors: ["أخضر"] },
      { id: 8,  img: "septa8.jpg",  name: "حزام مطاطي رقيق",  price: "85د.ل", colors: ["أزرق خفيف"] },
      { id: 9,  img: "septa9.jpg",  name: "حزام مطاطي رقيق",  price: "85د.ل", colors: ["أزرق داكن"] },
      { id: 10, img: "septa10.jpg", name: "حزام مطاطي رقيق", price: "85د.ل", colors:["أسود داكن"] },
      { id: 11, img: "septa11.jpg", name: "حزام مطاطي رقيق", price: "85د.ل", colors: ["أبيض كريمي"] },
      { id: 12, img: "septa12.jpg", name: "حزام مطاطي رقيق", price: "85د.ل", colors: ["بني"] },
      { id: 13, img: "septa13.jpg", name: "حزام مطاطي رجالي", price: "90د.ل", colors: ["أبيض رصاصي"] },
      { id: 14, img: "septa14.jpg", name: "حزام مطاطي رجالي", price: "90د.ل", colors: ['اسود+ازرق+أبيض'] },
      { id: 15, img: "septa15.jpg", name: "حزام مطاطي رجالي", price: "90د.ل", colors: ["أزرق+بني+ابيض"] },
      { id: 16, img: "septa16.jpg", name: "حزام مطاطي رجالي", price: "90د.ل", colors: ["أزرق+أحمر+أبيض"] },
      { id: 17, img: "septa17.jpg", name: "حزام مطاطي رجالي", price: "90د.ل", colors: ["أبيض+بيج"] },
      { id: 18, img: "septa18.jpg", name: "حزام مطاطي رجالي", price: "90د.ل", colors: ["أسود+بني+كريمي"] },
      { id: 19, img: "septa19.jpg", name: "سبتة جلد طبيعي رجالي وجهين", price: "150د.ل", colors: ["أسود", "بني"] },
      { id: 20, img: "septa20.jpg", name: "حزام نسائي", price: "88د.ل", colors: ["ذهبي بودري"] },
      { id: 21, img: "septa21.jpg", name: "حزام مطاطي رجالي", price: "90د.ل", colors: ["اسود+أحمر+أبيض"] },
       { id: 22, img: "septa22.jpg", name: "حزام  تثبيت داخلي", price: "30د.ل", colors: ["أسود"] },
       { id: 23, img: "septa23.jpg", name: "حزام نسائي جلد", price: "75د.ل", colors: ["اسود"] },
       { id: 24, img: "septa24.jpg", name:"حزام نسائي جلد", price: "75د.ل", colors: ["بيج فاتح"] },
       { id: 25, img: "septa25.jpg", name: "حزام  نسائي داخلي", price: "75د.ل", colors: ["بني"] },
       { id: 26, img: "septa26.jpg", name: "حزام  نسائي جلد", price: "75د.ل", colors: ["أبيض"] },
      
        
        { id: 29, img: "septa29.jpg", name: "حزام  نسائي جلد", price: "75د.ل", colors: ["بني بيج"] },
    ];    
                                                                                    
    const grid = document.getElementById("productsGrid");   

    products.forEach(function(product) {
      const card = document.createElement("div");
      card.className = "product-card";
      card.innerHTML =
        '<div class="product-img-wrap">' +
          '<span class="product-code">موديل #' + product.id + '</span>' +
          '<img src="' + product.img + '" alt="' + product.name + '" loading="lazy">' +
        '</div>' +
        '<div class="product-info">' +
          '<div>' +
            '<div class="product-name">' + product.name + '</div>' +
            '<div class="product-price">' + product.price + '</div>' +
            '<div class="product-colors-preview">الألوان المتوفرة: ' + product.colors.join(" • ") + '</div>' +
          '</div>' +
          '<button type="button" class="btn-open-order" onclick="openOrderModal(' + product.id + ')">اطلب الآن</button>' +
        '</div>';
      grid.appendChild(card);
    });

    function clearInvalidMarks() {
      const inputs = document.querySelectorAll("#orderForm .form-control");
      inputs.forEach(function(el) {
        el.classList.remove("invalid");
      });
      document.getElementById("errorMsg").style.display = "none";
    }

    function openOrderModal(productId) {
      const product = products.find(function(p) { return p.id === productId; });
      if (!product) return;

      clearInvalidMarks();

      document.getElementById("modalImg").src = product.img;
      document.getElementById("modalTitle").textContent = product.name;
      document.getElementById("modalPriceDisplay").textContent = product.price;

      document.getElementById("productImageFile").value = product.img;
      document.getElementById("fieldProductName").value = product.name;
      document.getElementById("fieldProductPrice").value = product.price;

      // تعبئة اقتراحات الألوان الخاصة بالمنتج مع إمكانية الاختيار أو التعديل
      const datalist = document.getElementById("colorsDatalist");
      datalist.innerHTML = "";
      product.colors.forEach(function(color) {
        const option = document.createElement("option");
        option.value = color;
        datalist.appendChild(option);
      });

      document.getElementById("fieldColor").value = product.colors[0] || "";
      document.getElementById("fieldQuantity").value = "1";
      document.getElementById("orderModal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("orderModal").classList.remove("active");
    }

    document.getElementById("orderModal").addEventListener("click", function(e) {
      if (e.target === this) {
        closeModal();
      }
    });
function buildFullImageUrl(imgFile) {
  try {
    const currentHref = window.location.href;
    if (currentHref.startsWith("http://") || currentHref.startsWith("https://")) {
      const parsed = new URL(currentHref);
      parsed.hash = "";
      parsed.search = "";
      let pathname = decodeURIComponent(parsed.pathname);
      if (pathname.toLowerCase().endsWith("/index.html")) {
        pathname = pathname.slice(0, -"/index.html".length + 1);
      } else if (!pathname.endsWith("/")) {
        pathname = pathname.slice(0, pathname.lastIndexOf("/") + 1);
      }
      return parsed.origin + pathname + imgFile;
    }
    return imgFile;
  } catch (err) {
    return imgFile;
  }
}




    function sendWhatsAppOrder(e) {
      e.preventDefault();
      clearInvalidMarks();

      const productNameEl = document.getElementById("fieldProductName");
      const productPriceEl = document.getElementById("fieldProductPrice");
      const colorEl = document.getElementById("fieldColor");
      const quantityEl = document.getElementById("fieldQuantity");
      const fullNameEl = document.getElementById("fieldFullName");
      const phoneEl = document.getElementById("fieldPhone");
      const addressEl = document.getElementById("fieldAddress");
      const imgFile = document.getElementById("productImageFile").value.trim();

      const productName = productNameEl.value.trim();
      const productPrice = productPriceEl.value.trim();
      const color = colorEl.value.trim();
      const quantity = quantityEl.value.trim();
      const fullName = fullNameEl.value.trim();
      const phone = phoneEl.value.trim();
      const address = addressEl.value.trim();

      let hasError = false;

      if (!productName) { productNameEl.classList.add("invalid"); hasError = true; }
      if (!productPrice) { productPriceEl.classList.add("invalid"); hasError = true; }
      if (!color) { colorEl.classList.add("invalid"); hasError = true; }
      if (!quantity || isNaN(Number(quantity)) || Number(quantity) < 1) { quantityEl.classList.add("invalid"); hasError = true; }
      if (!fullName) { fullNameEl.classList.add("invalid"); hasError = true; }
      if (!phone) { phoneEl.classList.add("invalid"); hasError = true; }
      if (!address) { addressEl.classList.add("invalid"); hasError = true; }

      if (hasError) {
        document.getElementById("errorMsg").style.display = "block";
        return;
      }

      const fullImageUrl = buildFullImageUrl(imgFile);

      const message =
        "السلام عليكم، طلب جديد من متجر سبتة Septa:\n\n" +
        "• اسم المنتج: " + productName + "\n" +
        "• السعر: " + productPrice + "\n" +
        "• اللون: " + color + "\n" +
        "• الكمية المطلوبة: " + quantity + "\n" +
        "• الاسم الثلاثي: " + fullName + "\n" +
        "• رقم الهاتف: " + phone + "\n" +  
        "• العنوان: " + address + "\n" +
        "• رابط صورة المنتج: " + fullImageUrl;

      const whatsappUrl = "https://wa.me/" + SHOP_WHATSAPP + "?text=" + encodeURIComponent(message);
      window.open(whatsappUrl, "_blank");
    }
  </script>
  
</body>
</html>
